<script type="module">
  import { db } from "./firebase.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const form = document.getElementById("scoutingForm");

  form.addEventListener("submit", async function(scout) {
    scout.preventDefault(); // stops the page from refreshing

    // collect all the values from the form
    const entry = {
      teamNumber: document.getElementById("teamNumber").value,
      teamName:   document.getElementById("teamName").value,
      autoType:   document.getElementById("autoType").value,
      autoBalls:  document.getElementById("avgAutoBalls").value,
      teleOpPosition:  document.getElementById("teleOpPosition").value,
      teleopBalls: document.getElementById("avgTeleOpBalls").value,
      endgamePosition: document.getElementById("endgamePosition").value,
      extraComments:   document.getElementById("extraComments").value,
      timestamp:  new Date()
    };

    // save it to Firebase
    try {
      await addDoc(collection(db, "scoutingEntries"), entry);
      alert("Entry saved!");
      form.reset();
    } catch (error) {
      alert("Error saving: " + error.message);
    }
  });

</script>


<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scouting</title>
    <link rel="stylesheet" href="style.css">
  
    <!--centers and organises in a row-->
   <style>
        .center {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 1rem 0;
        }

    </style>
</head>
 
<body>
    <header>
        <nav>
            <img src="Images/NBGFTSEE.png" alt="Logo" style="width:10%;">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="Scouting.html">Scouting Form</a></li>

            </ul>
        </nav>
    </header>
 
    <form id="scoutingForm">
 
        <!-- Team number -->
        <div class="center">
            <label for="teamNumber">Team Number *</label>
            <input type="number" id="teamNumber" required>
        </div>
 
        <!-- Team name -->
        <div class="center">
            <label for="teamName">Team Name</label>
            <input type="text" id="teamName">
        </div>
 
        <!-- Autonomous position -->
        <div class="center">
            <label for="autoType">Autonomous</label>
            <select id="autoType">
                <option value="none">No auto</option>
                <option value="Close">Close</option>
                <option value="Far">Far</option>
                <option value="Both">Both</option>
            </select>
        </div>
 
        <!-- Auto balls -->
        <div class="center">
            <label for="avgAutoBalls">Average balls in auto</label>
            <input type="number" id="avgAutoBalls">
        </div>
 
        <!-- TeleOp position -->
        <div class="center">
            <label for="teleOpPosition">TeleOp</label>

            </select>
        </div>
 
        <!-- TeleOp balls -->
        <div class="center">
            <label for="avgTeleOpBalls">Average balls in TeleOp</label>
            <input type="number" id="avgTeleOpBalls">
        </div>
 
        <!-- Endgame position -->
        <div class="center">
            <label for="endgamePosition">Endgame</label>
            <select id="endgamePosition">
                <option value="Full Park">Full Park</option>
                <option value="Half Park">Half Park</option>
                <option value="Lift">Lift</option>
            </select>
        </div>
 
        <!-- Extra comments -->
        <div class="center">
            <label for="extraComments">Extra Comments</label>
            <textarea id="extraComments"></textarea>
        </div>
 
        <!-- Submit Button -->
        <div class="center">
            <button type="submit">Submit</button>
        </div>
 
    </form>
</body>
</html>
