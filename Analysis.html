<script type="module">
  import { getTeamStats } from './ftcscout.js';
  import { getTeamBasics } from './ftcscout.js';
  import { db, collection, query, where, getDocs, doc, deleteDoc } from './firebase.js';
//Look up and Display function
async function lookUpAndDisplay(inputId, basicId, infoId, scoutingId, buttonId){
  //Records inputed team number
  const number = document.getElementById(inputId).value; 

  const QS = await getTeamStats(Number(number), 2025); //Checks teams current seasons rankings
  const BS = await getTeamBasics(Number(number)); //Team name and location


  const fireQ = query(collection(db, "scoutingEntries"), where("teamNumber", "==", number));
  const querySnapshot = await getDocs(fireQ);

  let amount = 0
  let form = "";
  
  querySnapshot.forEach((docSnap) => {
    const scout = docSnap.data();
    amount+=1;
    form += `
    <details>
    <summary> <b>Scouting form: ${amount}</b> </summary>
      <p>${scout.teamName}</p>
      <p>Auto: ${scout.autoType}</p>
      <p>TeleOp: ${scout.teleOpPosition}</p>
      <p>Endgame: ${scout.endgamePosition}</p>
        <details>
        <summary>Comments</summary>
          <p style= "width: 300px; overflow-wrap: break-word;">${scout.extraComments}</p>
        </details>
    </details>
    <button class="deleteBtn" data-id="${docSnap.id}">Delete</button>`;  
  
  });

  //returns html or the <p>...<p> will be returned if html is false ("")
  document.getElementById(scoutingId).innerHTML = form || "<p>No scouting entries yet.</p>"; 

  //Delete Button 
  document.querySelectorAll(`#${scoutingId} .deleteBtn`).forEach((btn) => {  
    btn.addEventListener('click', async () => {
      await deleteDoc(doc(db, "scoutingEntries", btn.dataset.id)); //waits for code to be deleted on the database
      document.getElementById(buttonId).click(); // Runs look up button (essentially reloading)
    });
  });

  //Fail safe if team doesnt exist (stats also dont exist)
  if (!BS) {
  document.getElementById(basicId).innerHTML = `<p>This team doesnt exist.</p>`;
  document.getElementById(infoId).innerHTML = ``;
  return;
  }


  //Imports values in a template and put it in box with the respective basic id
  document.getElementById(basicId).innerHTML = `
  <div>
  <h2>${BS.name} (Team ${BS.number})</h2> 
  <h2>(Location ${BS.location.country})</h2> 
  </div>`;


  //Fail safe if team didnt participate this season (the order lets the team basics to still be there)
  if (!QS) {
  document.getElementById(infoId).innerHTML = `<p>No stats found for this team/season.</p>`;
  return;
  }


  //Imports values in a template and put it in box with respective info id
  document.getElementById(infoId).innerHTML = `
  <div>
  <p>Total OPR: ${Math.round(QS.tot.value)} (Rank ${QS.tot.rank})</p> 
  <p>Auto OPR: ${Math.round(QS.auto.value)} (Rank ${QS.auto.rank})</p> 
  <p>TeleOp OPR: ${Math.round(QS.dc.value)} (Rank ${QS.dc.rank})</p> 
  <p>Endgame OPR: ${Math.round(QS.eg.value)} (Rank ${QS.eg.rank})</p>
  </div>`;
} 

//Button 1 
document.getElementById('lookupBtn').addEventListener('click', async () => { 
  lookUpAndDisplay('teamNumberInput','teamBasics', 'teamInfo', 'scouting', 'lookupBtn');
});
//Button 2 
document.getElementById('lookupBtn2').addEventListener('click', async () => { 
  lookUpAndDisplay('teamNumberInput2','teamBasics2', 'teamInfo2', 'scouting2','lookupBtn2');
});
  
  
  //Graph Button and Logic
  let ftcseechart = null;
  document.getElementById('graphit').addEventListener('click', async () => { 
    const number1 = document.getElementById('teamNumberInput').value;
    const number2 = document.getElementById('teamNumberInput2').value;
    const QS1 = await getTeamStats(Number(number1), 2025);
    const QS2 = await getTeamStats(Number(number2), 2025);

    const labels = [number1, number2];
    const rank = [QS1.tot.rank, QS2.tot.rank];
  const data = {
    labels: labels,
    datasets: [{
      label: 'OPR Rank',
      data: rank,
      backgroundColor: 'rgb(255, 152, 48)'
    }]
  };

  const config = {
    type: 'bar',
    data: data,
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  };

  if (ftcseechart) {
    ftcseechart.destroy();
  }

  ftcseechart = new Chart(
    document.getElementById('ftseechart'),
    config
  );
})

//Download All Scouted Data button and logic
document.getElementById('downloadAllBtn').addEventListener('click', async () => {
 
  const snapshot = await getDocs(collection(db, "scoutingEntries")); //grabs every scouting entry in the database
 
  //Column headers for the CSV
  const headers = ["Team Number","Team Name","Auto Type","Avg Auto Balls","TeleOp Position","Avg TeleOp Balls","Endgame Position","Extra Comments"];
  const rows = [headers];
 
  snapshot.forEach((doc) => {
    const scout = doc.data();
    rows.push([
      scout.teamNumber,
      scout.teamName,
      scout.autoType,
      scout.autoBalls,
      scout.teleOpPosition,
      scout.teleopBalls,
      scout.endgamePosition,
      scout.extraComments
    ]);
  });
 
 
  function csvEscape(value) {
    //If the value is blank return blank
    if (value === undefined || value === null) return "";
     //Wraps a value in quotes and escapes (/) any quotes inside it, so commas or newlines in comments don't break the CSV
    return `"${String(value).replace(/"/g, '""')}"`;
  }
 
  const csvContent = rows.map(row => row.map(csvEscape).join(",")).join("\n");
 
  //Builds a downloadable file in the browser and clicks it automatically
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "scouting_data.csv";
  link.click();
  URL.revokeObjectURL(url);
});
</script>
