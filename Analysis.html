<script type="module">
  import { getTeamStats } from './ftcscout.js';
  import { getTeamBasics } from './ftcscout.js';
  import { db, collection, query, where, getDocs } from './firebase.js';

  

  //Waits until button gets clicked then 
document.getElementById('lookupBtn').addEventListener('click', async () => { 
  //Records inputed team number
  const number = document.getElementById('teamNumberInput').value; 

const QS = await getTeamStats(Number(number), 2025); //Checks teams current seasons rankings
const BS = await getTeamBasics(Number(number)); //Team name and location
const fireQ = query(collection(db, "scoutingEntries"), where("teamNumber", "==", number));
const wait = await getDocs(fireQ);
let amount = 1
let html = "";
wait.forEach((doc) => {
  const scout = doc.data();
  html += `<b>Scouting form: ${amount}</b>
  <p>${scout.teamName}</p>
  <p>Auto: ${scout.autoType}</p>
  <p>TeleOp: ${scout.teleOpPosition}</p>
  <p>Endgame: ${scout.endgamePosition}</p>;
  <p>Comments: ${scout.extraComments}</p>`;
  amount+=1;
});
document.getElementById('scouting').innerHTML = html || "<p>No scouting entries yet.</p>";

//Fail safe if team doesnt exist (stats also dont exist)
if (!BS) {
  document.getElementById('teamBasics').innerHTML = `<p>This team doesnt exist.</p>`;
  document.getElementById('teamInfo').innerHTML = ``;
  return;
}


//Imports values in a template and put it in box with id=teamInfo
document.getElementById('teamBasics').innerHTML = `
<div>
  <h2>${BS.name} (Team ${BS.number}) (Location ${BS.location.country})</h2> 
</div>`;


//Fail safe if team didnt participate this season (the order lets the team basics to still be there)
if (!QS) {
  document.getElementById('teamInfo').innerHTML = `<p>No stats found for this team/season.</p>`;
  return;
}


//Imports values in a template and put it in box with id=teamInfo
document.getElementById('teamInfo').innerHTML = `
<div>
  <p>Total OPR: ${Math.round(QS.tot.value)} (Rank ${QS.tot.rank})</p> 
  <p>Auto OPR: ${Math.round(QS.auto.value)} (Rank ${QS.auto.rank})</p> 
  <p>TeleOp OPR: ${Math.round(QS.dc.value)} (Rank ${QS.dc.rank})</p> 
  <p>Endgame OPR: ${Math.round(QS.eg.value)} (Rank ${QS.eg.rank})</p>
</div>`;



}); 



  //Waits until button2 gets clicked then 
document.getElementById('lookupBtn2').addEventListener('click', async () => { 
  //Records inputed team number
  const number = document.getElementById('teamNumberInput2').value; 

const QS = await getTeamStats(Number(number), 2025); //Checks teams current seasons rankings
const BS = await getTeamBasics(Number(number)); //Team name and location


const fireQ = query(collection(db, "scoutingEntries"), where("teamNumber", "==", number));
const wait = await getDocs(fireQ);
let amount = 1
let html = "";
wait.forEach((doc) => {
  const scout = doc.data();
  html += `<b>Scouting form: ${amount}</b>
  <p>${scout.teamName}</p>
  <p>Auto: ${scout.autoType}</p>
  <p>TeleOp: ${scout.teleOpPosition}</p>
  <p>Endgame: ${scout.endgamePosition}</p>
  <p>Comments: ${scout.extraComments}</p>`;
  amount+=1;
});
document.getElementById('scouting2').innerHTML = html || "<p>No scouting entries yet.</p>";

//Fail safe if team doesnt exist
if (!BS) {
  document.getElementById('teamBasics2').innerHTML = `<p>This team doesnt exist.</p>`;
  document.getElementById('teamInfo2').innerHTML = ``;
  return;
}


//Imports values in a template and put it in box with id=teamInfo
document.getElementById('teamBasics2').innerHTML = `
<div>
  <h2>${BS.name} (Team ${BS.number}) (Location ${BS.location.country})</h2> 
</div>`;


//Fail safe if team didnt participate this season
if (!QS) {
  document.getElementById('teamInfo2').innerHTML = `<p>No stats found for this team/season.</p>`;
  return;
}


//Imports values in a template and put it in box with id=teamInfo
document.getElementById('teamInfo2').innerHTML = `
<div>
  <p>Total OPR: ${Math.round(QS.tot.value)} (Rank ${QS.tot.rank})</p> 
  <p>Auto OPR: ${Math.round(QS.auto.value)} (Rank ${QS.auto.rank})</p> 
  <p>TeleOp OPR: ${Math.round(QS.dc.value)} (Rank ${QS.dc.rank})</p> 
  <p>Endgame OPR: ${Math.round(QS.eg.value)} (Rank ${QS.eg.rank})</p>
</div>`;

}); 
</script>
